# The decisions map: the concepts a reader reasons with, and under each
# what was asked, what was weighed, what was chosen and on what
# grounds. A concept's definition is the rule that holds here, so a
# decision can break it. A concept asks the questions raised under it,
# a question weighs the options put to it, and the decision that
# answered it is what settled it. A later decision supersedes an
# earlier one, and a decision asks a question that puts it back in
# doubt, so --around a question reaches everything weighed for it. A
# concept covers another it absorbs, so the covered one hangs under it
# and leaves the overview.
#
# Every edge runs from the node above to the one under it, and a
# node may take more than one: a decision that supersedes another keeps
# whatever settled it too. What no edge reaches heads the map; maps
# show names a node once and points back to it wherever a later edge
# reaches it again.

purpose = "what was asked, what was chosen, and why, so a settled question is not reopened"

[nodes.concept]
definition = ""

[nodes.question]
why = ""

[nodes.option]
why = ""
state = ["open", "dead"]

[nodes.decision]
why = ""

[edges.asks]
from = ["concept", "decision"]
to = "question"

[edges.settled]
from = ["concept", "question"]
to = "decision"

[edges.weighs]
from = "question"
to = "option"

[edges.covers]
from = "concept"
to = "concept"

[edges.supersedes]
from = "decision"
to = "decision"
