# The decisions map: the concepts a reader reasons with, and under each
# what was asked, what was weighed, what was chosen and on what
# grounds. A concept's definition is the rule that holds here, so a
# decision can break it. A question or decision is about a concept. An
# option answers a question - or the decision itself, when none was
# raised - and says whether it still stands and why. A decision
# resolves the question, and a later decision supersedes an earlier
# one. A question reopens a decision it puts in doubt, so --around a
# question reaches everything weighed for it. A concept covers another
# it absorbs, so the covered one nests under it and leaves the
# overview.

name = "concepts"
purpose = "what was asked, what was chosen, and why, so a settled question is not reopened"

[[node]]
kind = "concept"
gloss = "one thing a reader reasons with; its definition is the rule that holds here, not a gloss"
requires = ["definition"]

[[node]]
kind = "question"
properties = ["why"]

[[node]]
kind = "option"
gloss = "an answer weighed for a question: open while it still stands, dead once it lost, saying which in `state` and why in `why`"
requires = ["why"]
states = ["open", "dead"]

[[node]]
kind = "decision"
properties = ["why"]

[[edge]]
kind = "about"
gloss = "from a question or decision to the concept it belongs under; a decision that resolves a question inherits its place"
from = ["question", "decision"]
to = "concept"

[[edge]]
kind = "covers"
gloss = "from a concept to one it absorbs - a narrower rule, or a worse wording of the same one; the covered concept nests under it and leaves the overview"
from = "concept"
to = "concept"

[[edge]]
kind = "resolves"
from = "decision"
to = "question"

[[edge]]
kind = "answers"
gloss = "from an option to the question it answers, or to the decision it was weighed against when no question was raised"
from = "option"
to = ["question", "decision"]

[[edge]]
kind = "supersedes"
from = "decision"
to = "decision"

[[edge]]
kind = "reopens"
gloss = "from a question to a decision it puts in doubt; the decision stands until a new one supersedes it"
from = "question"
to = "decision"

# The lines percept sends at each moment it has a channel to speak on:
# a session's start, a prompt reaching the log, and a reflection's own
# opening.
[rules]
"message.received" = [
  "propose by recording: an option under its question, state \"open\", before arguing for it",
  "before stopping, record what you reasoned with. Sharpen a concept that already states it, or cover yours under it; add a peer only when neither fits",
]
"reflection.started" = [
  "cite the event id printed above as --source for everything you record here, and stop at what you can defend in one pass - a map is folded over many reflections, not one",
  "read `percept start` first: repoint a citation it calls renamed, reread the claim behind one it calls changed, and leave what it calls gone as history",
  "two concepts stating one rule leave one - change the survivor to carry the loser's sources, re-point what was about the loser, then remove it",
  "a concept that is an instance of another is covered by it, never removed: `covers` points from the keeper down to what it holds",
  "a concept the user last changed is theirs - record a question against it, never a change",
]
