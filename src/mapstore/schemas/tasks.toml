# The tasks map: what is left to do. A task says why it matters, an
# outcome resolves it - done, or dropped and why - a task blocks the
# one that must wait for it, and a rewritten task supersedes the old
# wording, never removes it.

name = "tasks"
purpose = "what is left to do, why it matters, and what it waits on, so a session picks up the next item without re-deriving it"
headlines = ["task"]
settles = { by = "outcome", of = "task" }

[[node]]
name = "task"
gloss = "one piece of work left to do, saying why it matters in its `why` property"
requires = ["why"]

[[node]]
name = "outcome"
gloss = "what became of a task: done with its commit, or dropped with the reason"

[[edge]]
name = "resolves"
gloss = "from an outcome to the task it settles"
from = "outcome"
to = "task"

[[edge]]
name = "blocks"
gloss = "from a task to the one that must wait for it"
from = "task"
to = "task"

[[edge]]
name = "supersedes"
gloss = "from a reworded task to the wording it replaces"
from = "task"
to = "task"
