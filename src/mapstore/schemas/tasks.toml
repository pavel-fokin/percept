# The tasks map: what is left to do. A task says why it matters, its
# state says what became of it - done or dropped, the why of that
# change saying what happened - a task blocks the one that must wait
# for it, and a reworded task changes its name in place.

name = "tasks"
purpose = "what is left to do, why it matters, and what it waits on, so a session picks up the next item without re-deriving it"
headlines = ["task"]

[[node]]
kind = "task"
gloss = "one piece of work left to do, saying why it matters in its `why` property"
requires = ["why"]
state = ["open", "done", "dropped"]

[[edge]]
kind = "blocks"
from = "task"
to = "task"
