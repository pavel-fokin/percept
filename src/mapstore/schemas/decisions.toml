# The decisions map: what was asked, what was weighed, what was chosen
# and on what grounds. An option answers a question - or the decision
# itself, when none was raised - and says whether it still stands and
# why; a decision resolves the question, a later decision supersedes an
# earlier one, and a question reopens a decision it puts in doubt, so
# --around a question reaches everything weighed for it.

name = "decisions"
purpose = "what was asked, what was chosen, and why, so a settled question is not reopened"
headlines = ["question", "decision"]

[[node]]
kind = "question"

[[node]]
kind = "option"
gloss = "an answer weighed for a question: open while it still stands, dead once it lost, saying which in `state` and why in `why`"
requires = ["why"]
state = ["open", "dead"]

[[node]]
kind = "decision"

[[edge]]
kind = "resolves"
from = "decision"
to = "question"

[[edge]]
kind = "answers"
gloss = "from an option to the question it answers, or to the decision it was weighed against when no question was raised"
from = "option"
to = ["question", "decision"]

[[edge]]
kind = "supersedes"
from = "decision"
to = "decision"

[[edge]]
kind = "reopens"
gloss = "from a question to a decision it puts in doubt; the decision stands until a new one supersedes it"
from = "question"
to = "decision"
