# The decisions map: what was asked, what was weighed, what was chosen
# and on what grounds. An option answers its question, evidence
# supports or contradicts an option, a decision resolves the question,
# and a later decision supersedes an earlier one, so --around a
# question reaches everything weighed for it.

name = "decisions"
purpose = "what was asked, what was chosen, and why, so a settled question is not reopened"
headlines = ["question", "decision"]

[[node]]
name = "question"
gloss = "a matter the project had to settle"

[[node]]
name = "option"
gloss = "an alternative that was weighed and lost, saying why in its `why` property"
requires = ["why"]

[[node]]
name = "evidence"
gloss = "a fact that supports or contradicts an option"

[[node]]
name = "decision"
gloss = "the choice that was made, and the grounds for it"

[[edge]]
name = "answers"
gloss = "from an option to the question it was weighed for"
from = "option"
to = "question"

[[edge]]
name = "supports"
gloss = "from evidence to an option it backs"
from = "evidence"
to = "option"

[[edge]]
name = "contradicts"
gloss = "from evidence to an option it undercuts"
from = "evidence"
to = "option"

[[edge]]
name = "resolves"
gloss = "from a decision to the question it settles"
from = "decision"
to = "question"

[[edge]]
name = "supersedes"
gloss = "from a decision to an earlier one it replaces"
from = "decision"
to = "decision"

[[edge]]
name = "reopens"
gloss = "from a question to a decision it puts in doubt; the decision stands until a new one supersedes it"
from = "question"
to = "decision"
