# The decisions map: the concepts a reader reasons with, and under each
# what was asked, what was weighed, what was chosen and on what
# grounds. A concept's definition is the rule that holds here, so a
# decision can break it. A question or decision is about a concept. An
# option answers a question - or the decision itself, when none was
# raised - and says whether it still stands and why. A decision
# resolves the question, and a later decision supersedes an earlier
# one. A question reopens a decision it puts in doubt, so --around a
# question reaches everything weighed for it.

name = "decisions"
purpose = "what was asked, what was chosen, and why, so a settled question is not reopened"
headlines = ["concept", "question", "decision"]

[[node]]
kind = "concept"
gloss = "one thing a reader reasons with; its definition is the rule that holds here, not a gloss"
requires = ["definition"]

[[node]]
kind = "question"
properties = ["why"]

[[node]]
kind = "option"
gloss = "an answer weighed for a question: open while it still stands, dead once it lost, saying which in `state` and why in `why`"
requires = ["why"]
states = ["open", "dead"]

[[node]]
kind = "decision"
properties = ["why"]

[[edge]]
kind = "about"
gloss = "from a question or decision to the concept it belongs under; a decision that resolves a question inherits its place"
from = ["question", "decision"]
to = "concept"

[[edge]]
kind = "resolves"
from = "decision"
to = "question"

[[edge]]
kind = "answers"
gloss = "from an option to the question it answers, or to the decision it was weighed against when no question was raised"
from = "option"
to = ["question", "decision"]

[[edge]]
kind = "supersedes"
from = "decision"
to = "decision"

[[edge]]
kind = "reopens"
gloss = "from a question to a decision it puts in doubt; the decision stands until a new one supersedes it"
from = "question"
to = "decision"

# The lines a turn carries, after the prompt's event id.
[rules]
turn = [
  "propose by recording: an option under its question, state \"open\", before arguing for it",
  "before stopping, record each thing you reasoned with as a concept whose definition is the rule that held",
]
