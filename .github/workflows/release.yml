name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Two merges landing together would otherwise read the same last
# release and claim the same number. A run left pending while a third
# queues behind it is cancelled and publishes nothing: its commit is
# already in the release the newer run builds, so what is lost is one
# number, not one merge.
concurrency:
  group: release

jobs:
  # The number the binary is stamped with, so it has to be settled
  # before anything is built.
  number:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The highest r-number published, not the newest release: a
          # tag of another shape must not be counted, and a failed
          # call must not restart the count at r1, which would replace
          # a release someone already downloaded.
          last=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[].tag_name | select(test("^r[0-9]+$")) | ltrimstr("r") | tonumber] | max // 0')
          echo "tag=r$(( last + 1 ))" >> "$GITHUB_OUTPUT"

  build:
    needs: number
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: install cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      # build.rs embeds web/dist/index.html, which is not in the
      # checkout: without this the binary ships the stub page.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build the page
        working-directory: web
        run: |
          npm ci
          npm run build
      - run: cargo build --release --target ${{ matrix.target }}
        env:
          PERCEPT_RELEASE: ${{ needs.number.outputs.tag }}
      - name: package
        run: |
          out="percept-${{ matrix.target }}"
          mkdir "$out"
          cp target/${{ matrix.target }}/release/percept "$out/"
          cp scripts/lib-install.sh "$out/"
          tar czf "$out.tar.gz" "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: percept-${{ matrix.target }}
          path: percept-${{ matrix.target }}.tar.gz

  release:
    needs: [number, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.number.outputs.tag }}
          name: ${{ needs.number.outputs.tag }}
          body: Built from ${{ github.sha }}.
          files: dist/*
