# The ideas map: a candidate worth doing that nobody has committed to
# yet - the difference between "might be worth building" and a task's
# "needs doing, just waiting". An idea that gets picked up becomes a
# task recorded with a `--source` citing the idea's own node.added
# event, so the task's provenance names which idea it came from without
# an edge crossing from this map into `tasks`: `Map::resolve` only
# looks up nodes within its own schema, so a typed edge cannot point
# out of this map (see "Is it possible by current design to cite
# different maps?", 2026-09-09).

name = "ideas"
purpose = "a candidate worth doing, not yet committed to a task, so a session revisits the backlog instead of re-deriving it"
headlines = ["idea"]

[[node]]
kind = "idea"
gloss = "something that might be worth building, saying why in its `why` property"
requires = ["why"]
