[package]
name = "percept"
version = "0.1.0"
edition = "2021"

[features]
default = []
lab = [
    "dep:ratatui",
    "dep:crossterm",
    "dep:ratatui-textarea",
    "dep:textwrap",
    "dep:tokio-stream",
    "dep:futures-core",
    "dep:reqwest",
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:ignore",
    "dep:regex",
    "dep:globset",
]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ratatui = { version = "0.30.2", optional = true }
crossterm = { version = "0.29", features = ["event-stream"], optional = true }
ratatui-textarea = { version = "0.9.2", optional = true }
textwrap = { version = "0.16.2", optional = true }
uuid = { version = "1.26.0", features = ["v7", "std"] }
tokio = { version = "1.53", features = ["rt", "macros", "time"] }
tokio-stream = { version = "0.1.19", optional = true }
futures-core = { version = "0.3", optional = true }
jiff = "0.2.35"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"], optional = true }
toml = "0.9"
tiny_http = "0.12"
tree-sitter = { version = "0.27", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
ignore = { version = "0.4.33", optional = true }
regex = { version = "1.13.1", optional = true }
globset = { version = "0.4.20", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
