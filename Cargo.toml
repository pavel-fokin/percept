[package]
name = "percept"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
clap = { version = "4.6.7", features = ["derive"] }
jiff = { version = "0.2.38", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "fs", "io-std", "io-util", "net"] }
uuid = { version = "1.27.0", features = ["serde", "v7"] }
