[package]
name = "percept"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.30.2"
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui-textarea = "0.9.2"
textwrap = "0.16.2"
uuid = { version = "1.26.0", features = ["v7", "std"] }
tokio = { version = "1.53", features = ["rt", "macros"] }
tokio-stream = "0.1.19"
rand = "0.10.2"
jiff = "0.2.35"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level = 3
